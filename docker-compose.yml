services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watersense
      POSTGRES_USER: watersense
      POSTGRES_PASSWORD: watersense_demo
    volumes: [watersense_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watersense"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://watersense:watersense_demo@database:5432/watersense
      CORS_ORIGINS: http://localhost:5173,http://localhost
      SIMULATOR_ENABLED: "true"
    ports: ["8000:8000"]
    depends_on:
      database: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/live
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {watersense_db: {}}
