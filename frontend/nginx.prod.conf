# In-container nginx for watersense-web.
#
# Serves the built SPA and reverse-proxies /api, /ws, /docs to watersense-api,
# so the browser only ever talks to one origin (https://watersense.selenos.world).
# That means no CORS preflights and no mixed-content on the WebSocket.

upstream watersense_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Vite emits content-hashed filenames into /assets - safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live telemetry WebSocket (/ws/live). Must not be buffered and must not
    # time out at the default 60s.
    location /ws/ {
        proxy_pass http://watersense_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://watersense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # FastAPI interactive docs.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://watersense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA routes: /, /dashboard, /stations/:id, /demo-control ...
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
