# Host nginx site for WaterSense AI.
#
#   sudo cp deploy/nginx-watersense.conf /etc/nginx/sites-available/watersense
#   sudo ln -sf /etc/nginx/sites-available/watersense /etc/nginx/sites-enabled/watersense
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file in place to add the 443 server
# block and cert paths:
#
#   sudo certbot --nginx -d watersense.selenos.world
#
# This file touches nothing else on the box - other vhosts (selenos.world etc.)
# are untouched.

upstream watersense_web {
    # Must match WEB_PORT in /opt/watersense/.env
    server 127.0.0.1:8770;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name watersense.selenos.world;

    access_log /var/log/nginx/watersense.access.log;
    error_log  /var/log/nginx/watersense.error.log;

    client_max_body_size 4m;

    # Live telemetry WebSocket. Needs the upgrade dance, buffering off, and a
    # read timeout far above the default 60s or the dashboard's LIVE LINK
    # indicator drops every minute.
    location /ws/ {
        proxy_pass http://watersense_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OPTIONAL HARDENING - the app ships with no authentication, so anyone who
    # finds the URL can drive the simulator and acknowledge/resolve alerts.
    # To password-protect the presenter surface and simulator control endpoints:
    #
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/watersense.htpasswd demo
    #
    # then uncomment:
    #
    # location /demo-control {
    #     auth_basic "WaterSense presenter";
    #     auth_basic_user_file /etc/nginx/watersense.htpasswd;
    #     proxy_pass http://watersense_web;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /api/v1/simulator/ {
    #     auth_basic "WaterSense presenter";
    #     auth_basic_user_file /etc/nginx/watersense.htpasswd;
    #     proxy_pass http://watersense_web;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://watersense_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
